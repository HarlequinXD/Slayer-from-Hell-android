# Slayer from Hell: character simulation settings for the warden.
# Any key can be removed: SimSettings.java holds the defaults. Units: metres, kilograms, seconds, radians, N·m, N·s.

# ---- body
# Standing height and total mass (with armour). The segment masses and inertias are derived from these.
height=1.80
totalMass=75
# Carried weight on the right forearm (the chainsaw) and in the left hand (the shotgun).
sawMass=6.5
gunMass=3.4

# ---- solver
# Fixed physics step and the substeps inside it (more = stiffer and more stable, costs more).
fixedDt=0.0166667
maxStepsPerFrame=3
gravity=9.81
# 0 low (3 substeps), 1 medium (5), 2 high (8), 3 ultra (12)
quality=2
linearDamping=0.05
angularDamping=0.35
# Passive damping of every joint (higher when the muscles are weak).
jointDamping=0.8
friction=0.85
restitution=0.05

# ---- muscles
# Natural frequency (rad/s) and damping ratio of the joint PD controllers; gains are scaled per joint by its effective inertia.
stiffness=14
dampingRatio=0.9
# Multiplies every joint's anatomical torque limit.
maxTorqueScale=1.0
# Fraction of each limb's weight the muscles hold up in advance (feedforward).
gravityCompensation=0.85
fatigueRate=0.25
fatigueRecovery=0.35

# ---- reactions and balance
# The powered-ragdoll assist that keeps a reacting body upright (natural frequencies, rad/s).
rootAssistLinear=9
rootAssistAngular=10
# How far (m) the capture point may leave the support polygon: up to this she holds, beyond it she steps, past 2.2x she falls.
balanceMargin=0.12
# The PUSH test button: impulse in N·s (each press scales it randomly by 0.6–2.4).
pushTestImpulse=55
# Muscle strength while falling, just after a hard impact, lying on the ground, and getting up (0..1).
fallStrength=0.6
impactStrength=0.25
groundStrength=0.18
recoverStrength=1.0
# Seconds of stillness on the ground before she gets up.
settleTime=0.6
