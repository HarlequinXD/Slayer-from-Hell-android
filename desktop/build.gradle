plugins { id 'application' }
repositories { mavenCentral() }

def lwjgl = '3.3.4'
def natives = ['natives-windows', 'natives-linux']
dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjgl")
    implementation 'javazoom:jlayer:1.0.1'   // MP3 decoding for the recorded narration
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl'].each { m ->
        implementation "org.lwjgl:$m"
        natives.each { n -> runtimeOnly "org.lwjgl:$m::$n" }
    }
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
// the game's own sources (everything but the Android activity) plus the desktop platform layer;
// the APK's assets (baked models and textures) become classpath resources
sourceSets {
    main {
        java { srcDirs = ['src/main/java', '../app/src/main/java']; exclude '**/MainActivity.java' }
        resources { srcDirs = ['src/main/resources', '../app/src/main/assets'] }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-nowarn' }
application {
    mainClass = 'com.harlequin.slayer.DesktopMain'
    applicationDefaultJvmArgs = ['-Xmx1g']
}
jar { manifest { attributes 'Main-Class': 'com.harlequin.slayer.DesktopMain' } }
